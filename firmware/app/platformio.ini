; PlatformIO Project Configuration File for csiGarland
;
; Target hardware: ESP32-C6-LCD-1.3 (Waveshare)

[platformio]
default_envs = esp32c6

[csigarland]
CSIGARLAND_FIRMWARE_BASE = 1.1.1
; The sources' date, which the compiler takes for __DATE__ in place of today's, so that a build made
; again is the same to the byte. A certificate made with no clock starts no earlier than it. Move it
; forward with a release; one left behind only lets such a certificate start earlier.
CSIGARLAND_SOURCE_DATE = 2026-11-06
; The zlib of the Python a release is built with, as zlib.ZLIB_RUNTIME_VERSION says it: the portal's pages
; are gzipped with it, and another zlib packs them into other bytes, so another image. 1.1.0 was built
; under Python 3.14 on Windows, whose zlib is zlib-ng. The build records the one it used, and warns of
; another; a release refuses another.
CSIGARLAND_RELEASE_ZLIB = 1.3.1.zlib-ng

[env:esp32c6]
platform = espressif32@7.0.1
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200
upload_speed = 921600
extra_scripts =
    pre:scripts/firmware_build_version.py
    pre:scripts/effect_pack.py
    pre:scripts/ota_signing.py
    pre:scripts/portal_pack.py
    post:scripts/link_order.py
    post:scripts/sdkconfig_made.py
build_flags =
    -DCSIGARLAND_LED_COUNT=32
    -DCSIGARLAND_MAX_LEDS=256
    -DCSIGARLAND_PORTAL_IP=\"192.168.4.1\"
    -DCSIGARLAND_POWER_LIMIT_MA=1400
    -DCSIGARLAND_GARLAND_GPIO=2
    -DCSIGARLAND_BUTTON_RED_GPIO=3
    -DCSIGARLAND_BUTTON_WHITE_GPIO=20
    -DCSIGARLAND_BUTTON_SPEED_GPIO=23
    -DCSIGARLAND_POWER_GATE_GPIO=1
    -DCSIGARLAND_RTC_SDA_GPIO=17
    -DCSIGARLAND_RTC_SCL_GPIO=16
    -DCSIGARLAND_LCD_MOSI=6
    -DCSIGARLAND_LCD_SCK=7
    -DCSIGARLAND_LCD_CS=14
    -DCSIGARLAND_LCD_DC=15
    -DCSIGARLAND_LCD_RST=21
    -DCSIGARLAND_LCD_BL=22

; The Release profile: the same firmware with no debug information, which is what is published. It
; builds in a folder of its own, .pio/build/esp32c6-release, as its flags differ for every component:
; sharing one with esp32c6 would compile all of ESP-IDF again at each change of profile.
[env:esp32c6-release]
extends = env:esp32c6

; Host unit tests for the hardware-free logic: pio test -e native
; The parser tests use cJSON from managed_components, so build esp32c6 once first.
[env:native]
platform = native
test_build_src = no
extra_scripts = pre:scripts/effect_pack.py
build_flags =
    -std=c++20
    -Wall
    -Wextra
    -Werror
    -DCSIGARLAND_MAX_LEDS=256
    -Isrc
    -Igenerated
    -Imanaged_components/espressif__cjson/cJSON

; The screens as pictures for the documents, from the firmware's own drawing code, on this computer.
; Run by deploy/new-doc-images.ps1. Uses LVGL from managed_components, so build esp32c6 once first.
[env:screens]
platform = native
build_src_filter =
    -<*>
    +<display_view.cpp>
    +<../tools/screens/*.cpp>
    +<../managed_components/lvgl__lvgl/src/**/*.c>
build_flags =
    -std=c++20
    -DLV_CONF_INCLUDE_SIMPLE
    -DCSIGARLAND_MAX_LEDS=256
    -Isrc
    -Itools/screens
    -Imanaged_components/lvgl__lvgl
    -Imanaged_components/lvgl__lvgl/src
